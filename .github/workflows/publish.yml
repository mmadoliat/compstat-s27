on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: Build Site

permissions:
  contents: write

jobs:
  build-website:
    runs-on: ubuntu-24.04

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

      # Posit Package Manager binaries for Ubuntu 24.04 (Noble)
      RENV_CONFIG_REPOS_OVERRIDE: >-
        https://packagemanager.posit.co/cran/__linux__/noble/latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          # Use the R version recorded in renv.lock
          r-version: renv
          use-public-rspm: true

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libudunits2-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libmagick++-dev \
            libnode-dev

      - name: Install Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
          version: 1.10.18

      - name: Restore packages with renv
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 3

      - name: Check renv status
        shell: Rscript {0}
        run: |
          renv::status()

      - name: Render Quarto project
        uses: quarto-dev/quarto-actions/render@v2

      - name: Configure Git
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.name "Mehdi Maadooliat"
          git config --global user.email "mmadoliat@gmail.com"

      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.6.4
        with:
          branch: gh-pages
          folder: _site